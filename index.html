<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Planet LLC | Tech & Professional Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #00ffcc;
            --deep-obsidian: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --text-gray: #b0b0b0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--deep-obsidian);
            color: white;
            line-height: 1.6;
        }

        /* Clean Banner Header */
        .banner-container {
            width: 100%;
            max-height: 400px;
            overflow: hidden;
            border-bottom: 2px solid var(--primary-green);
        }

        .banner-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Ethos & Mission Bar */
        .mission-bar {
            background: linear-gradient(90deg, #0a0a0a, #1a1a1a);
            padding: 40px 20px;
            text-align: center;
        }

        .mission-bar h1 {
            font-size: 2.8rem;
            margin: 0;
            color: white;
            letter-spacing: 3px;
        }

        .mission-bar p {
            color: var(--primary-green);
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: 300;
        }

        /* Rest of the grid... */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s ease;
        }

        .card:hover { border-color: var(--primary-green); }

        .card h2 { color: var(--primary-green); margin-top: 0; }

        .card ul { list-style: none; padding: 0; color: var(--text-gray); }

        .card li { margin-bottom: 12px; padding-left: 20px; position: relative; }

        .card li::before { content: "▹"; position: absolute; left: 0; color: var(--primary-green); }

        footer { text-align: center; padding: 60px 20px; border-top: 1px solid #222; }
