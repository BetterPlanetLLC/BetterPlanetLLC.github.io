<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Planet LLC | Tech & Professional Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #00ffcc;
            --deep-obsidian: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --text-gray: #b0b0b0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--deep-obsidian);
            color: white;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.8)), 
                        url('https://raw.githubusercontent.com/betterplanetllc/betterplanetllc.github.io/main/banner.png'); /* Replace with your actual banner path later */
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--primary-green);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--primary-green);
            max-width: 600px;
        }

        /* Service Grid */
        .container {
            max-width: 1100px;
            margin: -50px auto 50px;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-green);
        }

        .card h2 {
            color: var(--primary-green);
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card ul {
            list-style: none;
            padding: 0;
            color: var(--text-gray);
        }

        .card li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .card li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--primary-green);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
        }

        .ethos {
            font-style: italic;
            margin-bottom: 20px;
        }

        .social-links a {
            color: white;
            font-size: 1.5rem;
            margin: 0 15px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: var(--primary-green);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>BETTER PLANET</h1>
        <p>Tech & Professional Solutions | Scaling Globally</p>
    </section>

    <div class="container">
        <div class="grid">
            <div class="card">
                <h2><i class="fas fa-code"></i> Software & Dev</h2>
                <ul>
                    <li>
